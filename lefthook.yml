# Git hooks managed by lefthook (https://lefthook.dev).
# Installed automatically via the root "prepare" script on `pnpm install`.

pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: pnpm turbo lint
    - name: typecheck
      run: pnpm turbo typecheck

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}

# Push only goes through if the app builds (turbo cache keeps repeats fast).
pre-push:
  jobs:
    - name: build
      run: pnpm turbo build --filter=web
